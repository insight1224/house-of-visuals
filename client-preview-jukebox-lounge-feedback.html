<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jukebox Lounge Feedback | House of Visuals</title>
  <link rel="stylesheet" href="/styles.css">

  <style>
    body {
      margin: 0;
      background: #f6f1e8;
      color: #171717;
      font-family: Arial, sans-serif;
    }

    .feedback-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 20px;
    }

    .feedback-card {
      width: min(820px, 100%);
      background: #fff;
      border-radius: 28px;
      padding: 42px;
      box-shadow: 0 24px 70px rgba(0,0,0,0.12);
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-size: 13px;
      font-weight: 700;
      color: #7a5b2e;
      margin-bottom: 12px;
      text-align: center;
    }

    h1 {
      font-size: clamp(34px, 6vw, 56px);
      line-height: 1;
      margin: 0 0 16px;
      text-align: center;
    }

    .intro {
      max-width: 640px;
      margin: 0 auto 30px;
      line-height: 1.7;
      font-size: 16px;
      color: #444;
      text-align: center;
    }

    form {
      display: grid;
      gap: 18px;
    }

    label {
      display: grid;
      gap: 8px;
      font-weight: 700;
      color: #222;
    }

    input,
    select,
    textarea {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid rgba(0,0,0,0.14);
      border-radius: 16px;
      padding: 14px 16px;
      font: inherit;
      background: #fbfaf7;
      color: #171717;
    }

    textarea {
      min-height: 170px;
      resize: vertical;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .button-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 8px;
    }

    button,
    .back-link {
      display: inline-block;
      border: 0;
      border-radius: 999px;
      padding: 14px 22px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      font: inherit;
    }

    button {
      background: #111;
      color: #fff;
    }

    .back-link {
      background: #f1eadf;
      color: #111;
    }

    @media (max-width: 700px) {
      .feedback-card {
        padding: 30px 20px;
      }

      .form-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="feedback-wrap">
    <section class="feedback-card">
      <div class="eyebrow">House of Visuals Client Feedback</div>
      <h1>Website Preview Feedback</h1>

      <p class="intro">
        Please use this form to send edits, updates, or notes for the Jukebox Lounge website preview.
      </p>

      <form action="/api/client-feedback" method="POST">
        <input type="hidden" name="client_project" value="Jukebox Lounge">

        <div class="form-row">
          <label>
            Your Name
            <input type="text" name="full_name" required>
          </label>

          <label>
            Your Email
            <input type="email" name="email" required>
          </label>
        </div>

        <label>
          Which page is this feedback for?
          <select name="page_name">
            <option value="">Select a page</option>
            <option value="Overall Website">Overall Website</option>
            <option value="Home">Home</option>
            <option value="Services">Services</option>
            <option value="Portfolio">Portfolio</option>
            <option value="Rates">Rates</option>
            <option value="Measurement Information">Measurement Information</option>
            <option value="About">About</option>
            <option value="Contact">Contact</option>
          </select>
        </label>

        <label>
          Feedback / Requested Changes
          <textarea name="feedback_message" placeholder="Please share any edits, changes, questions, or notes here." required></textarea>
        </label>

        <div class="button-row">
          <button type="submit">Send Feedback</button>
          <a class="back-link" href="/client-preview/jukebox-lounge">Back to Preview</a>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
