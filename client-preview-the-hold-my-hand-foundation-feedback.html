<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>The Hold My Hand Foundation Feedback | House of Visuals</title>
  <link rel="stylesheet" href="/styles.css">

  <style>
    body {
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(200, 149, 79, 0.14), transparent 28%),
        #f6f1e8;
      color: #171717;
      font-family: Arial, sans-serif;
    }

    .feedback-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 20px;
    }

    .feedback-card {
      width: min(820px, 100%);
      background: #fff;
      border-radius: 28px;
      padding: 42px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.12);
    }

    .eyebrow {
      margin-bottom: 12px;
      color: #7a5b2e;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-align: center;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(34px, 6vw, 56px);
      line-height: 1;
      text-align: center;
    }

    .intro {
      max-width: 640px;
      margin: 0 auto 30px;
      color: #444;
      font-size: 16px;
      line-height: 1.7;
      text-align: center;
    }

    form {
      display: grid;
      gap: 18px;
    }

    label {
      display: grid;
      gap: 8px;
      color: #222;
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid rgba(0, 0, 0, 0.14);
      border-radius: 16px;
      padding: 14px 16px;
      background: #fbfaf7;
      color: #171717;
      font: inherit;
    }

    textarea {
      min-height: 170px;
      resize: vertical;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .button-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 8px;
    }

    button,
    .back-link {
      display: inline-block;
      border: 0;
      border-radius: 999px;
      padding: 14px 22px;
      font: inherit;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    button {
      background: #153c39;
      color: #fff;
    }

    .back-link {
      background: #f1eadf;
      color: #171717;
    }

    @media (max-width: 700px) {
      .feedback-card {
        padding: 30px 20px;
      }

      .form-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="feedback-wrap">
    <section class="feedback-card">
      <div class="eyebrow">House of Visuals Concept Feedback</div>

      <h1>Website Concept Feedback</h1>

      <p class="intro">
        Please use this form to share your thoughts, questions, or requested
        updates for The Hold My Hand Foundation website concept.
      </p>

      <form action="/api/client-feedback" method="POST">
        <input
          type="hidden"
          name="client_project"
          value="The Hold My Hand Foundation"
        >

        <input
          type="hidden"
          name="client_slug"
          value="the-hold-my-hand-foundation"
        >

        <div class="form-row">
          <label>
            Your Name
            <input type="text" name="full_name" required>
          </label>

          <label>
            Your Email
            <input type="email" name="email" required>
          </label>
        </div>

        <label>
          Which part of the concept is your feedback for?
          <select name="page_name">
            <option value="">Select an option</option>
            <option value="Overall Website Concept">Overall Website Concept</option>
            <option value="Homepage Hero">Homepage Hero</option>
            <option value="Mission Section">Mission Section</option>
            <option value="Programs Section">Programs Section</option>
            <option value="Founder Story Section">Founder Story Section</option>
            <option value="Get Involved Section">Get Involved Section</option>
            <option value="Colors and Style">Colors and Style</option>
            <option value="Photos and Imagery">Photos and Imagery</option>
            <option value="Content and Wording">Content and Wording</option>
          </select>
        </label>

        <label>
          Feedback, Questions, or Requested Changes
          <textarea
            name="feedback_message"
            placeholder="Please share any thoughts, questions, edits, or ideas here."
            required
          ></textarea>
        </label>

        <div class="button-row">
          <button type="submit">Send Feedback</button>

          <a
            class="back-link"
            href="/client-preview/the-hold-my-hand-foundation/"
          >
            Back to Concept Preview
          </a>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
