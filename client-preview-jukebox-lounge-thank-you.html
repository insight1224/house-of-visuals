<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback Sent | House of Visuals</title>
  <link rel="stylesheet" href="/styles.css">

  <style>
    body {
      margin: 0;
      background: #f6f1e8;
      color: #171717;
      font-family: Arial, sans-serif;
    }

    .thank-you-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 20px;
    }

    .thank-you-card {
      width: min(760px, 100%);
      background: #fff;
      border-radius: 28px;
      padding: 42px;
      box-shadow: 0 24px 70px rgba(0,0,0,0.12);
      text-align: center;
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-size: 13px;
      font-weight: 700;
      color: #7a5b2e;
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(34px, 6vw, 56px);
      line-height: 1;
      margin: 0 0 16px;
    }

    p {
      max-width: 620px;
      margin: 0 auto 28px;
      line-height: 1.7;
      font-size: 16px;
      color: #444;
    }

    .button-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      border-radius: 999px;
      padding: 14px 22px;
      font-weight: 700;
      text-decoration: none;
      background: #111;
      color: #fff;
    }

    .btn.secondary {
      background: #f1eadf;
      color: #111;
    }
  </style>
</head>

<body>
  <main class="thank-you-wrap">
    <section class="thank-you-card">
      <div class="eyebrow">House of Visuals</div>
      <h1>Feedback Sent</h1>
      <p>
        Thank you! Your website preview feedback has been sent to House of Visuals.
        We’ll review your notes and follow up with any questions.
      </p>

      <div class="button-row">
        <a class="btn" href="/client-preview/jukebox-lounge/demo/">Back to Website Demo</a>
        <a class="btn secondary" href="/client-preview/jukebox-lounge">Back to Preview Page</a>
      </div>
    </section>
  </main>
</body>
</html>
