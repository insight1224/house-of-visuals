<script>
  function setupCarousel(carouselId) {
    const carousel = document.getElementById(carouselId);
    if (!carousel) return;

    const slides = carousel.querySelectorAll(".carousel-slide");
    const current = carousel.querySelector(".current");
    const total = carousel.querySelector(".total");
    let index = 0;

    if (total) total.textContent = slides.length || 0;
    if (current) current.textContent = slides.length ? 1 : 0;

    function showSlide(nextIndex) {
      if (!slides.length) return;

      slides[index].classList.remove("active");
      const activeVideo = slides[index].querySelector("video");
      if (activeVideo) activeVideo.pause();

      index = (nextIndex + slides.length) % slides.length;

      slides[index].classList.add("active");
      if (current) current.textContent = index + 1;
    }

    carousel.querySelectorAll(".carousel-arrow").forEach((btn) => {
      btn.addEventListener("click", () => {
        showSlide(btn.classList.contains("next") ? index + 1 : index - 1);
      });
    });
  }

  setupCarousel("photoCarousel");
  setupCarousel("videoCarousel");

  document.querySelectorAll(".gallery-tab").forEach((tab) => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".gallery-tab").forEach((btn) => btn.classList.remove("active"));
      document.querySelectorAll(".media-carousel").forEach((carousel) => carousel.classList.remove("active"));

      tab.classList.add("active");
      document.getElementById(tab.dataset.target).classList.add("active");
    });
  });
</script>

  </body>
</html>
